name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm run check
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/myhondaplus-vehicle-card.js
          generate_release_notes: true
