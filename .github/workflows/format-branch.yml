name: Format branch

on:
  push:
    branches: [feat/premium-vehicle-dashboard]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-vehicle-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run format
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json tsconfig.json vite.config.ts tests
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style: format premium dashboard sources"
            git push
          fi
