name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check source syntax
        run: npm run check
      - name: Build distribution
        run: npm run build
      - name: Verify distribution exists
        run: test -s dist/myhondaplus-vehicle-card.js
