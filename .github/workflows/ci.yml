name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - name: Verify HACS bundle
        run: |
          test -s dist/myhondaplus-vehicle-card.js
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
